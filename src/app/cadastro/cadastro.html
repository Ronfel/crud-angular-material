<div fxLayout="row" fxLayoutAlign="center">
  <div fxLayout="column" fxFlex="1000px">
    <form class="mt-60" #clienteFrm="ngForm" (ngSubmit)="salvar()">
        <mat-card appearance="outlined">
            <mat-card-header>
                <mat-card-title>{{ modoEdicao ? 'Editar Cliente' : 'Dados Pessoais' }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div fxLayout="row" fxLayoutGap="12px">
                    <mat-form-field class="full-width">
                        <mat-label>Nome</mat-label>
                        <input matInput 
                               type="text" 
                               placeholder="Ex: José da Silva" 
                               name="nome" [(ngModel)]="cliente.nome" required>
                    </mat-form-field>
                    <mat-form-field class="full-width">
                        <mat-label>CPF</mat-label>
                        <input matInput
                               mask="000.000.000-00"
                               [dropSpecialCharacters]="false"
                               type="text" 
                               placeholder="Ex: 123.456.789-00" 
                               name="cpf" 
                               [(ngModel)]="cliente.cpf" required>
                    </mat-form-field>
                </div>
                <div fxLayout="row" fxLayoutGap="12px">
                    <mat-form-field class="full-width">
                        <mat-label>Telefone</mat-label>
                        <input matInput 
                               mask="(00) 00000-0000"
                               [dropSpecialCharacters]="false"
                               type="text" 
                               placeholder="Ex: (11) 91234-5678" 
                               name="telefone" 
                               [(ngModel)]="cliente.telefone" required>
                    </mat-form-field>
                    <mat-form-field class="full-width">
                        <mat-label>E-mail</mat-label>
                        <input matInput 
                               type="email" 
                               placeholder="Ex: jose.silva@email.com" 
                               name="email" [(ngModel)]="cliente.email" required>
                    </mat-form-field>
                </div>
                <div>
                    <mat-form-field class="half-width">
                        <mat-label>Data de Nascimento</mat-label>
                        <input matInput
                               mask="d0/M0/0000"
                               [dropSpecialCharacters]="false"
                               type="text"
                               placeholder="DD/MM/YYYY"
                               name="dataNascimento" 
                               [(ngModel)]="cliente.dataNascimento" required>
                    </mat-form-field>
                </div>
            </mat-card-content>
            <mat-card-actions>
                <button mat-flat-button 
                        color="primary" 
                        type="submit" 
                        [disabled]="!clienteFrm.form.valid">
                        <mat-icon [fontIcon]="modoEdicao ? 'save_as' : 'save'"></mat-icon>
                    {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
                </button>
                <button *ngIf="modoEdicao && !confirmandoExclusao" class="ml-5" mat-flat-button
                        color="warn"
                        type="button"
                        (click)="confirmandoExclusao = true">
                    <mat-icon fontIcon="delete"></mat-icon>
                    Excluir cliente
                </button>
                <ng-container *ngIf="confirmandoExclusao">
                    <span>Confirmar a exclusão deste cliente?</span>
                    <button class="ml-5" mat-flat-button
                            color="warn"
                            type="button"
                            (click)="excluir()">
                        <mat-icon fontIcon="delete_forever"></mat-icon>
                        Confirmar exclusão
                    </button>
                    <button class="ml-5" mat-button
                            type="button"
                            (click)="cancelarExclusao()">
                        Cancelar
                    </button>
                </ng-container>
                <button *ngIf="!modoEdicao" class="ml-5" mat-flat-button color="warn" type="reset">
                    <mat-icon fontIcon="backspace"></mat-icon>
                    Limpar
                </button>
            </mat-card-actions>
        </mat-card>
    </form>
  </div>
</div>
