<div fxLayout="row" fxLayoutAlign="center">
    <div fxLayout="column" fxflex="1000px">
        <form class="mt-60" #buscaForm="ngForm" (ngSubmit)="pesquisar(buscaForm.value.nome)">
            <mat-card appearance="outlined">
                <mat-card-header>
                    <mat-card-title>Consulta de Clientes</mat-card-title>
                </mat-card-header>
                <mat-card-content class="mt-20">
                    <div fxLayout="row">
                        <div fxLayout="column" fxFlex="950px">
                            <mat-form-field>
                                <mat-label>Nome</mat-label>
                                <input matInput 
                                       type="text" 
                                       placeholder="Ex: José" 
                                       name="nome"
                                       required>
                            </mat-form-field>
                        </div>
                    </div>
                </mat-card-content>
                <mat-card-actions>
                    <button mat-flat-button 
                            color="primary" 
                            type="submit" 
                            [disabled]="!buscaForm.form.valid">
                            <mat-icon fontIcon="search"></mat-icon>
                        Pesquisar</button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
</div>
<div fxLayout="row" fxLayoutAlign="center">
    <div fxLayout="column" fxFlex="1000px">
        <mat-card appearance="outlined" class="mt-20">
            <mat-card-header>
                <mat-card-title>Resultado da Pesquisa</mat-card-title>
            </mat-card-header>
            <mat-card-content class="mt-20">
                <table mat-table [dataSource]="listaClientes" class="full-width">
                    <ng-container matColumnDef="nome">
                        <th mat-header-cell *matHeaderCellDef> Nome </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.nome}} </td>
                    </ng-container>
                    <ng-container matColumnDef="cpf">
                        <th mat-header-cell *matHeaderCellDef> CPF </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.cpf}} </td>
                    </ng-container>
                    <ng-container matColumnDef="telefone">
                        <th mat-header-cell *matHeaderCellDef> Telefone </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.telefone}} </td>
                    </ng-container>
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef> E-mail </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.email}} </td>
                    </ng-container>
                    <ng-container matColumnDef="dataNascimento">
                        <th mat-header-cell *matHeaderCellDef> Data de Nascimento </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.dataNascimento}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="['nome', 'cpf', 'telefone', 'email', 'dataNascimento']"></tr>
                    <tr mat-row *matRowDef="let row; columns: ['nome', 'cpf', 'telefone', 'email', 'dataNascimento'];"></tr>
                </table>
            </mat-card-content>
        </mat-card>
    </div>
